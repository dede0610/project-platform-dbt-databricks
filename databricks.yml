# This is a Databricks asset bundle definition for dbt_databricks_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbt_databricks_project
  databricks_cli_version: ">=1.21.0"

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  data_product_schema:
    description: The name of the data product schema
  schema:
    description: The schema to use
  warehouse_name:
    description: The name of the warehouse to use
  warehouse_id:
    description: The warehouse to use
  budget_policy_id:
    description: The serverless budget policy to use

targets:
  local:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # Environment variables set in the python.envFile '.databricks/.databricks.env'
    mode: development
    default: true
    workspace:
      host: https://dbc-4bf4b6b9-385d.cloud.databricks.com/
    variables:
      catalog: dev_dbt
      # Each engineer has their own set of schema
      data_product_schema: default
      schema: ${workspace.current_user.short_name}_${var.data_product_schema}
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
      budget_policy_id: "04d2f822-2265-4000-bdda-c4d7817b7259"

  dev:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
      budget_policy_id: "04d2f822-2265-4000-bdda-c4d7817b7259"

  tst:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
      budget_policy_id: "04d2f822-2265-4000-bdda-c4d7817b7259"

  prd:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
      budget_policy_id: "04d2f822-2265-4000-bdda-c4d7817b7259"
