# This is a Databricks asset bundle definition for dbt_databricks_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbt_databricks_project
  databricks_cli_version: ">=1.21.0"

include:
  - resources/*.yml
  - resources/*/*.yml

sync:
  include:
    - src/**
    - streamlit/**

# Variable declarations.
# These variables are assigned in the dev/tst/prd targets below.
variables:
  catalog:
    description: The catalog to use
  data_product_schema:
    description: The name of the data product schema
  schema:
    description: The schema to use
  warehouse_name:
    description: The name of the warehouse to use
  warehouse_id:
    description: The warehouse to use
  deployer_service_principal_id:
    description: Service principal ID used by CI/CD to deploy the bundle
    default: ""
  runner_service_principal_id:
    description: Service principal ID used to run the deployed job
    default: ""

targets:
  local:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # Environment variables set in the python.envFile '.databricks/.databricks.env'
    mode: development
    default: true
    workspace:
      host: https://dbc-4bf4b6b9-385d.cloud.databricks.com/
    variables:
      catalog: dev_dbt
      # Each engineer has their own set of schema
      data_product_schema: default
      schema: ${workspace.current_user.short_name}_${var.data_product_schema}
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
    resources:
      jobs:
        dbt_databricks_project_job:
          schedule:
            quartz_cron_expression: "0 0 11 * * ?"
            timezone_id: Australia/Melbourne

  dev:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
    resources:
      jobs:
        dbt_databricks_project_job:
          run_as:
            service_principal_name: ${var.runner_service_principal_id}
          permissions:
            - service_principal_name: ${var.deployer_service_principal_id}
              level: CAN_MANAGE
            - service_principal_name: ${var.runner_service_principal_id}
              level: CAN_MANAGE_RUN

  tst:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: tst_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
    resources:
      jobs:
        dbt_databricks_project_job:
          run_as:
            service_principal_name: ${var.runner_service_principal_id}
          permissions:
            - service_principal_name: ${var.deployer_service_principal_id}
              level: CAN_MANAGE
            - service_principal_name: ${var.runner_service_principal_id}
              level: CAN_MANAGE_RUN

  prd:
    # Environment variables set in GitHub Actions
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd_dbt
      data_product_schema: default
      schema: default
      warehouse_name: "Serverless Starter Warehouse"
      warehouse_id:
        lookup:
          warehouse: ${var.warehouse_name}
    resources:
      jobs:
        dbt_databricks_project_job:
          run_as:
            service_principal_name: ${var.runner_service_principal_id}
          permissions:
            - service_principal_name: ${var.deployer_service_principal_id}
              level: CAN_MANAGE
            - service_principal_name: ${var.runner_service_principal_id}
              level: CAN_MANAGE_RUN
