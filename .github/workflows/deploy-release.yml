name: Deploy release to prd (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v1.2.3)"
        required: true
        type: string

# Default to read-only for the whole workflow
permissions: read-all

concurrency:
  group: deploy-prd
  cancel-in-progress: false  # keep the previous manual run; change to true if you prefer cancelling

jobs:
  deploy-to-prd:
    # Match the reusable workflow's requirements only
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: prd
      ref: ${{ inputs.release_tag }}
      is_tag: true
      production: true
    secrets: inherit

  update-prd-tag:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: deploy-to-prd
    steps:
      - name: Checkout deployed release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Resolve deployed commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Point prd tag at deployed commit
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = 'tags/prd';
            const sha = process.env.TARGET_SHA;
            let exists = true;

            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }

            if (exists) {
              await github.rest.git.updateRef({ owner, repo, ref, sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha });
            }

  publish-dbt-docs:
    name: Publish production dbt docs
    needs: deploy-to-prd
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/dbt-docs-pages.yml
    with:
      release_version: ${{ inputs.release_tag }}
    secrets: inherit
