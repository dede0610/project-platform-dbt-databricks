name: Deploy release to prd (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v1.2.3)"
        required: true
        type: string

# Default to read-only for the whole workflow
permissions: read-all

concurrency:
  group: deploy-prd
  cancel-in-progress: false  # keep the previous manual run; change to true if you prefer cancelling

jobs:
  deploy-to-prd:
    # Match the reusable workflow's requirements only
    permissions:
      contents: write
      deployments: write
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: prd
      ref: ${{ inputs.release_tag }}
      is_tag: true
      production: true
      moving_tag: prd
    secrets: inherit

  publish-dbt-docs:
    name: Publish production dbt docs
    needs: deploy-to-prd
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/dbt-docs-pages.yml
    with:
      release_version: ${{ inputs.release_tag }}
    secrets: inherit
