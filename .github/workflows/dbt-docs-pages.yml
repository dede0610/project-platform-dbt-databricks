name: Publish dbt docs

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to publish (e.g., v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      release_version:
        description: "Release tag to publish (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_version }}

      - name: Set up Python, install uv, and sync dependencies
        uses: ./.github/actions/common-setup
        with:
          install-deps: true

      - name: Install dbt packages
        run: uv run dbt deps --project-dir src

      - name: Generate dbt docs
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_DOCS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_DOCS_CLIENT_SECRET }}
        run: uv run dbt docs generate --project-dir src --profiles-dir .dbt --target prd

      - name: Stage public documentation files
        run: |
          mkdir -p _site
          cp src/target/index.html src/target/manifest.json src/target/catalog.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
