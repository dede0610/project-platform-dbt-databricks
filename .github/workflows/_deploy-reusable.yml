name: _deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e.g., dev|tst|prd)"
        required: true
        type: string
      ref:
        description: "Ref to deploy (tag name or full SHA)"
        required: true
        type: string
      is_tag:
        description: "Treat 'ref' as a tag name (prefix with refs/tags/ for checkout)"
        required: false
        type: boolean
        default: false
      production:
        description: "Mark this as a production deployment (informational flag for your steps)"
        required: false
        type: boolean
        default: false
      moving_tag:
        description: "Optional moving tag to update after a successful deployment"
        required: false
        type: string
        default: ""
    outputs:
      result:
        description: "Outcome of the deploy job"
        value: ${{ jobs.deploy.outputs.result }}
      commit_sha:
        description: "Commit deployed by this workflow"
        value: ${{ jobs.deploy.outputs.commit_sha }}

jobs:
  deploy:
    name: Deploy ${{ inputs.ref }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # ✅ Single environment reference = single canonical deployment record
    #    You can set URL statically or from a step output (recommended below).
    environment:
      name: ${{ inputs.environment }}

    env:
      # Environment-scoped configuration (set these in Settings → Environments)
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_warehouse_name: ${{ vars.BUNDLE_VAR_WAREHOUSE_NAME }}
      BUNDLE_VAR_runner_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID_JOB }}
      BUNDLE_VAR_deployer_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID }}

    outputs:
      result: ${{ steps.set_result.outputs.result }}
      commit_sha: ${{ steps.rev.outputs.commit_sha }}

    steps:
      - name: Checkout at requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.is_tag && format('refs/tags/{0}', inputs.ref) || inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          clean: true

      - name: Resolve commit SHA & show context
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --verify HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved to commit: $SHA"
          echo "Nearest tag: $(git describe --tags --always --dirty || true)"
          echo "Commit message:"; git log -1 --pretty=oneline --decorate

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: "1.21.0"

      - name: Validate Bundle (Databricks)
        id: validate_bundle
        run: |
          set -euo pipefail
          echo "--> Validating bundle to ${{ inputs.environment }} environment"
          databricks bundle validate --target "${{ inputs.environment }}"

      - name: Deploy Bundle (Databricks)
        id: run_deploy
        run: |
          set -euo pipefail
          echo "Deploying bundle to ${{ inputs.environment }} environment"
          databricks bundle deploy --target "${{ inputs.environment }}"

      - name: Start Streamlit app (Databricks)
        env:
          APP_NAME: streamlit-app-${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "--> Starting ${APP_NAME}"
          databricks apps start "$APP_NAME"

      - name: Deploy Streamlit app (Databricks)
        env:
          APP_NAME: streamlit-app-${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "--> Deploying ${APP_NAME}"
          databricks apps deploy "$APP_NAME" --source-code-path "/Workspace/Shared/.bundle/dbt_databricks_project/${{ inputs.environment }}/files/streamlit"

      # Emit result for callers
      - name: Set result (success)
        id: set_result
        if: success()
        run: echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Set result (failure)
        if: failure()
        run: echo "result=failure" >> "$GITHUB_OUTPUT"

  update-moving-tag:
    name: Update ${{ inputs.moving_tag }} tag
    if: ${{ inputs.moving_tag != '' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or move tag to deployed commit
        uses: actions/github-script@v9
        env:
          MOVING_TAG: ${{ inputs.moving_tag }}
          TARGET_SHA: ${{ needs.deploy.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.MOVING_TAG;
            const ref = `tags/${tag}`;
            const sha = process.env.TARGET_SHA;
            let exists = true;

            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }

            if (exists) {
              await github.rest.git.updateRef({ owner, repo, ref, sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha });
            }
