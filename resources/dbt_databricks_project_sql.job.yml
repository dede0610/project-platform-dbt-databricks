resources:
  jobs:
    dbt_databricks_project_job:
      name: dbt_databricks_project_job

      tasks:
        - task_key: dbt_databricks_project_dbt_build
          environment_key: default
          dbt_task:
            project_directory: ../
            commands:
              - 'dbt deps'
              - 'dbt build --select dbt_databricks_project --exclude-resource-type unit_test'
            catalog: ${var.catalog}
            schema: ${var.schema}
            warehouse_id: ${var.warehouse_id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks>=1.11.0,<1.12.0
