dbt_databricks_project:
  target: dev

  outputs:
    dev:
      type: databricks
      catalog: dev_dbt
      host: dbc-4bf4b6b9-385d.cloud.databricks.com
      http_path: /sql/1.0/warehouses/147aa610b0179c78
      schema: default
      threads: 4
      token: "{{ env_var('DATABRICKS_TOKEN') }}"

    tst:
      type: databricks
      catalog: tst_dbt
      host: dbc-4bf4b6b9-385d.cloud.databricks.com
      http_path: /sql/1.0/warehouses/147aa610b0179c78
      schema: default
      threads: 4
      token: "{{ env_var('DATABRICKS_TOKEN') }}"

    prd:
      type: databricks
      catalog: prd_dbt
      host: dbc-4bf4b6b9-385d.cloud.databricks.com
      http_path: /sql/1.0/warehouses/147aa610b0179c78
      schema: default
      threads: 4
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"

    ci:
      type: databricks
      catalog: dev_dbt
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: /sql/1.0/warehouses/147aa610b0179c78
      schema: default
      threads: 4
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
